targets:
  $default:
    builders:
      drift_dev:
        options:
          # Generate strict, immutable data classes.
          store_date_time_values_as_text: false
          named_parameters: true
          # Use ms-since-epoch (INTEGER) for created_at / updated_at — easy delta sync.
          generate_connect_constructor: true
          write_to_columns_mixins: true
        generate_for:
          include:
            - lib/core/database/app_database.dart
            - lib/core/database/tables/**.dart
            - lib/core/database/daos/**.dart
